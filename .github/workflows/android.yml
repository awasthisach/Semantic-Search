# Android CI/CD Pipeline - Automated Build & Test
name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Create .env File
      run: |
        if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
        else
          echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.vvfsmartmanager.example.com' }}" > .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi
        fi

    - name: Run Unit Tests
      run: gradle :app:testDebugUnitTest

    - name: Run Lint
      run: gradle :app:lintDebug

    - name: Run Detekt
      run: gradle detekt

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Decode Keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

    - name: Build Release AAB
      env:
        KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.keystore', github.workspace) || '' }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle :app:bundleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab

  instrumented-tests:
    name: Run Instrumented Android Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Create .env File
        run: |
          if [ -n "${{ secrets.ENV_FILE_CONTENT }}" ]; then
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
          else
            echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.vvfsmartmanager.example.com' }}" > .env
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi
          fi

      - name: Run Instrumented Tests via Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: gradle :app:connectedDebugAndroidTest
