name: Generate Detekt Baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor == 'awasthisach'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate baseline
        run: ./gradlew :app:detektBaseline
      - name: Commit baseline and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-detekt-baseline.yml
          git add app/detekt-baseline.xml
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "chore(detekt): refresh baseline"
          git push origin HEAD:main
