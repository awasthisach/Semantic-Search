name: VVF Smart Media Manager CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g
  ORG_GRADLE_PROJECT_kotlin.caching.enabled: "false"

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-build-cache --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-build-cache --stacktrace

      - name: Run Detekt
        run: ./gradlew detekt --no-build-cache --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-build-cache --stacktrace
