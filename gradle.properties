# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# IDE settings may override values configured here.
# For more details, see https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.parallel=true
org.gradle.workers.max=4
kotlin.code.style=official
android.nonTransitiveRClass=true

# Gradle build/configuration caching.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin compiler execution strategy.
kotlin.compiler.execution.strategy=daemon

# Security mitigation for CVE-2026-53914 / GHSA-r937-wjx7-w2jp:
# Kotlin versions before 2.4.20 have unsafe build-cache metadata deserialization.
# Keep Kotlin's compiler cache disabled until a stable, CI-verified Kotlin >=2.4.20
# toolchain can be adopted. This does not disable the Gradle build cache.
kotlin.caching.enabled=false

# Allow KSP / Kotlin source set compatibility with AGP built-in Kotlin.
android.disallowKotlinSourceSets=false
